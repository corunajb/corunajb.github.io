    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    color: #eaeaea;
}

/* MAIN CARD */
.container {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(14px);
    border-radius: 18px;

    padding: 32px;
    margin-top: 20px;
    box-shadow: 0 20px 70px rgba(0,0,0,0.5);

/* TITLE */
h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 8px;
    font-size: 2.4em;
    letter-spacing: 0.5px;
}

.subtitle {
    text-align: center;
    color: rgba(255,255,255,0.65);
    margin-bottom: 26px;
    font-size: 0.95em;
}

/* BUTTONS */
.button-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 26px;
    flex-wrap: wrap;
}

button {
    padding: 12px 28px;
    font-size: 1.05em;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 600;
    letter-spacing: 0.3px;
}

/* RUN BUTTON */
#runBtn {
    background: linear-gradient(135deg, #6d7cff, #9a6bff);
    color: white;
    min-width: 170px;
    box-shadow: 0 10px 30px rgba(120, 90, 255, 0.25);
}

#runBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 35px rgba(120, 90, 255, 0.35);
}

#runBtn:active:not(:disabled) {
    transform: translateY(0px);
}

#runBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* CLEAR BUTTON */
#clearBtn {
    background: rgba(255,255,255,0.08);
    color: #eaeaea;
    min-width: 130px;
}

#clearBtn:hover {
    background: rgba(255,255,255,0.14);
}

/* LOGS */
.logs-container {
    background: #0a0d14;
    color: #d6d6d6;
    padding: 18px;
    border-radius: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 0.9em;
    max-height: 520px;
    overflow-y: auto;
    line-height: 1.5;
    border: 1px solid rgba(255,255,255,0.08);
}

/* LOG TYPES */
.log-entry {
    margin: 3px 0;
    padding: 2px 0;
}

.log-entry.info {
    color: #4db8ff;
}

.log-entry.error {
    color: #ff5c5c;
}

.log-entry.success {
    color: #62e38f;
}

.log-entry.warning {
    color: #ffd36a;
}

/* STATUS BAR */
.status-bar {
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    font-weight: 500;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
}

.status-bar.running {
    background: rgba(255, 215, 0, 0.10);
    color: #ffd36a;
    border-color: rgba(255, 215, 0, 0.25);
}

.status-bar.success {
    background: rgba(0, 255, 140, 0.10);
    color: #62e38f;
    border-color: rgba(0, 255, 140, 0.25);
}

.status-bar.error {
    background: rgba(255, 80, 80, 0.10);
    color: #ff5c5c;
    border-color: rgba(255, 80, 80, 0.25);
}

/* SCROLLBAR */
.logs-container::-webkit-scrollbar {
    width: 10px;
}

.logs-container::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
}

.logs-container::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.25);
}

/* SMALL SCREENS */
@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    h1 {
        font-size: 1.9em;
    }

    button {
        width: 100%;
    }
}

                localStorage.removeItem('exploit_running');
                window.log(`[ERROR] ${error.name}: ${error.message}`);
                statusBar.textContent = '✗ Exploit error: ' + error.message;
                statusBar.className = 'status-bar error';
                runBtn.disabled = false;
            });
        }

        function clearLogs() {
            document.getElementById('logsContainer').innerHTML = '';
            document.getElementById('statusBar').textContent = 'Ready';
            document.getElementById('statusBar').className = 'status-bar';
            localStorage.removeItem(STORAGE_KEY);
            logHistory = [];
        }
        
        // Check if we recovered from a crash
        window.addEventListener('load', function() {
            restoreLogsFromHistory();
            
            const wasRunning = localStorage.getItem('exploit_running');
            const crashTime = localStorage.getItem('crash_detected_time');
            
            if (wasRunning === 'true') {
                localStorage.removeItem('exploit_running');
                window.log('[CRASH] Page reloaded during exploit execution');
                const runBtn = document.getElementById('runBtn');
                const statusBar = document.getElementById('statusBar');
                statusBar.textContent = '⚠️ Page crashed and reloaded - exploit may have succeeded or failed';
                statusBar.className = 'status-bar error';
                runBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
